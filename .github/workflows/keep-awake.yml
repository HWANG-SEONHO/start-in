# 웹북 서버(s-i)를 한국 시간 06:00~23:59에만 5분마다 건드려 깨워 둔다. 00~06시는 쉬게 둔다.
# Render 무료는 15분 동안 요청이 없으면 잠든다. 하루 18시간 × 31일 = 558시간(무료 750시간 안).
# 응답이 10초를 넘으면 잠들어 있다 깬 것으로 보고 경고를 남긴다(Actions 실행 요약에서 확인).
name: 서버 깨워 두기
on:
  schedule:
    - cron: '*/5 21-23,0-14 * * *'   # UTC 기준 = 한국 06:00~23:59
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 웹북 서버 건드리기
        run: |
          r=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 90 https://s-i.onrender.com/api/health || echo "000 90")
          set -- $r
          echo "$(TZ=Asia/Seoul date '+%m-%d %H:%M') 응답 $1 · $2초" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v s="$2" 'BEGIN { if (s + 0 > 10) print "::warning::잠들어 있었음 — 깨우는 데 " s "초" }'
          [ "$1" = "200" ]
