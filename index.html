<!doctype html>
<!-- 학습용 설명: Vite/React 앱이 브라우저에서 처음 만나는 가장 바깥 HTML 파일입니다. -->
<html lang="ko">
  <head>

    <meta charset="UTF-8" />

    <!-- 휴대폰에서도 화면 너비를 기기에 맞춥니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#008e6c" />
    <meta
      name="description"
      content="STARTIN 조건별 채용 탐색, 공고 저장 및 개인 지원현황 관리"
    />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <title>스타트IN · 나에게 맞는 채용 기회</title>
  </head>
  <body>
    <!-- React는 이 빈 div 안에 화면 전체를 만들어 넣습니다. -->
    <div id="root"></div>

    <!-- 실제 React 시작점은 src/main.jsx입니다. -->
    <script src="/vendor/gsap.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
