.scene-three {

<footer class="cover-timebar"><span id="clock1">00:00</span><div class="timebar-track"><i id="progress1"></i></div><span>00:15</span></footer>

</section><div class="standalone-note">GSAP + MOTION CDN / 15s</div><script onerror="document.body.insertAdjacentHTML('beforeend','&lt;div class=cdn-error&gt;GSAP CDN 로드 실패 · 인터넷 연결을 확인하세요&lt;/div&gt;')" src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script><script>
function mmss(v){const s=Math.max(0,Math.floor(v));return `00:${String(s).padStart(2,'0')}`}
function wireClock(tl, clock, duration){
  tl.eventCallback('onUpdate',()=>{if(clock) clock.textContent=mmss(Math.min(duration,tl.time()))});
}
function scene(tl, sel, at, stay){
  tl.set(sel,{autoAlpha:1,pointerEvents:'auto'},at);
  tl.to(sel,{autoAlpha:0,duration:.28,ease:'power2.inOut',pointerEvents:'none'},at+stay-.28);
}
function resetScenes(selectors){selectors.forEach(s=>gsap.set(s,{autoAlpha:0,pointerEvents:'none'}));}

const D=15, root=document.querySelector('#cover'), clock=document.querySelector('#clock1'), progress=document.querySelector('#progress1');
const scenes=['.scene-one','.scene-two','.scene-three','.scene-numbers','.scene-four','.scene-final'];
let tl;
function build(){
  if(tl) tl.kill();
  gsap.killTweensOf('*');
  resetScenes(scenes); gsap.set(progress,{scaleX:0,transformOrigin:'0 50%'});
  gsap.set('.scene-one .typo-char,.scene-final .typo-char',{yPercent:125});
  gsap.set('.scene-two .statement',{y:42,opacity:0}); gsap.set('.scene-two .slash',{scaleY:0,transformOrigin:'50% 100%'});
  gsap.set('.scene-three .filter-word',{y:42,opacity:0,scale:.92});
  gsap.set('.scene-numbers .number-column,.scene-numbers .number-arrow',{y:46,opacity:0}); gsap.set('.number-caption',{y:15,opacity:0});
  gsap.set('.scene-four .step-word',{y:34,opacity:0}); gsap.set('.scene-four .step-line',{scaleX:0,transformOrigin:'0 50%'});
  gsap.set('.final-rule',{scaleX:0,transformOrigin:'0 50%'}); gsap.set('.final-sub,.final-enter-wrap',{y:16,opacity:0});
  tl=gsap.timeline({defaults:{ease:'power4.out'}});
  tl.to(progress,{scaleX:1,duration:D,ease:'none'},0);
  scene(tl,'.scene-one',0,2.8); tl.to('.scene-one .line-a .typo-char',{yPercent:0,duration:.72,stagger:.055},.10).to('.scene-one .line-b .typo-char',{yPercent:0,duration:.72,stagger:.045},.22).to('.scene-one .line-a',{xPercent:3,duration:.8,ease:'sine.inOut'},1.35).to('.scene-one .line-b',{xPercent:-3,duration:.8,ease:'sine.inOut'},1.35);
  scene(tl,'.scene-two',2.72,2.75); tl.to('.scene-two .slash',{scaleY:1,duration:.58},2.80).to('.scene-two .statement',{y:0,opacity:1,duration:.58,stagger:.13},2.88).to('.scene-two .statement.is-3',{x:18,duration:.72,ease:'power2.inOut'},4.05);
  scene(tl,'.scene-three',5.35,2.35); tl.to('.scene-three .filter-word',{y:0,opacity:1,scale:1,duration:.58,stagger:.085,ease:'back.out(1.45)'},5.45).to('.scene-three .is-top',{xPercent:-3,duration:1.0,ease:'sine.inOut'},6.15).to('.scene-three .is-bottom',{xPercent:3,duration:1.0,ease:'sine.inOut'},6.15);
  scene(tl,'.scene-numbers',7.58,2.70); tl.to('.scene-numbers .number-column,.scene-numbers .number-arrow',{y:0,opacity:1,duration:.66,stagger:.10},7.70).to('.number-caption',{y:0,opacity:1,duration:.48},8.15).to('.scene-numbers .is-c',{scale:1.055,duration:.48,ease:'back.out(1.8)'},8.55);
  scene(tl,'.scene-four',10.15,2.25); tl.to('.scene-four .step-word',{y:0,opacity:1,duration:.55,stagger:.14},10.28).to('.scene-four .step-line',{scaleX:1,duration:.65,stagger:.10},10.42);
  tl.set('.scene-final',{autoAlpha:1,pointerEvents:'auto'},12.34).to('.scene-final .final-line:first-child .typo-char',{yPercent:0,duration:.72,stagger:.035},12.43).to('.scene-final .final-line:nth-child(2) .typo-char',{yPercent:0,duration:.72,stagger:.032},12.54).to('.final-rule',{scaleX:1,duration:.70},13.05).to('.final-sub',{y:0,opacity:1,duration:.50},13.22).to('.final-enter-wrap',{y:0,opacity:1,duration:.50},13.42);
  wireClock(tl,clock,D); return tl;
}
function replay(){build().play(0)}
document.querySelector('#replay1').onclick=replay;
document.querySelector('#skip1').onclick=()=>{build().pause(D);tl.progress(1);gsap.set('.scene-final',{autoAlpha:1,pointerEvents:'auto'});gsap.set('.scene-final .typo-char',{yPercent:0});gsap.set('.final-rule',{scaleX:1});gsap.set('.final-sub,.final-enter-wrap',{opacity:1,y:0});if(clock)clock.textContent='00:15'};
document.querySelector('#enter1').onclick=()=>{const p=gsap.timeline({onComplete:()=>replay()});p.to('.cover-exit-panel.is-top',{scaleY:1,transformOrigin:'50% 0%',duration:.48,ease:'power4.inOut'},0).to('.cover-exit-panel.is-bottom',{scaleY:1,transformOrigin:'50% 100%',duration:.48,ease:'power4.inOut'},0).to(root,{opacity:0,duration:.25},.42)};
build();
</script><script type="module">
import { animate, press } from "https://cdn.jsdelivr.net/npm/motion@13.5.0/+esm";
window.__MOTION_CDN_READY__ = true;
const buttons = document.querySelectorAll('button');
buttons.forEach((button) => {
  button.addEventListener('pointerenter', () => animate(button, { scale: 1.025, y: -2 }, { type: 'spring', stiffness: 420, damping: 28 }));
  button.addEventListener('pointerleave', () => animate(button, { scale: 1, y: 0 }, { type: 'spring', stiffness: 420, damping: 30 }));
});
press('button', (element) => {
  animate(element, { scale: 0.97 }, { type: 'spring', stiffness: 520, damping: 32 });
  return () => animate(element, { scale: 1 }, { type: 'spring', stiffness: 520, damping: 30 });
});
</script></body></html>
