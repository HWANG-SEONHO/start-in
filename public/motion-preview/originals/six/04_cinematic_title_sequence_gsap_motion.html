<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>START IN — 04 Cinematic Title Sequence</title>
<style>
:root{
  --bg:#090b0e;
  --fg:#f4f0e8;
  --paper:#f2eee5;
  --ink:#0c0e10;
  --green:#3ecf8e;
  --blue:#86b4ff;
  --amber:#ffb15e;
  --muted:rgba(244,240,232,.58);
  --hair:rgba(244,240,232,.16);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,"Helvetica Neue",Arial,sans-serif}
body{user-select:none}
.stage{
  position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(circle at 18% 14%,rgba(62,207,142,.055),transparent 22%),
    radial-gradient(circle at 82% 18%,rgba(134,180,255,.045),transparent 22%),
    var(--bg);
}
.scene{position:absolute;inset:0;visibility:hidden;opacity:0;overflow:hidden}
.scene.is-active{visibility:visible}
.grid{position:absolute;inset:0;opacity:.16;pointer-events:none;background:
  linear-gradient(90deg,transparent 24.9%,rgba(255,255,255,.16) 25%,transparent 25.1%,transparent 49.9%,rgba(255,255,255,.16) 50%,transparent 50.1%,transparent 74.9%,rgba(255,255,255,.16) 75%,transparent 75.1%),
  linear-gradient(transparent 24.9%,rgba(255,255,255,.16) 25%,transparent 25.1%,transparent 49.9%,rgba(255,255,255,.16) 50%,transparent 50.1%,transparent 74.9%,rgba(255,255,255,.16) 75%,transparent 75.1%)}
.big{
  font-size:clamp(78px,13vw,220px);
  line-height:.82;
  font-weight:900;
  letter-spacing:-.078em;
  text-transform:uppercase;
}
.mid{
  font-size:clamp(44px,7.2vw,116px);
  line-height:.9;
  font-weight:900;
  letter-spacing:-.058em;
  text-transform:uppercase;
}
.micro{
  font-size:11px;
  line-height:1.4;
  letter-spacing:.19em;
  text-transform:uppercase;
  color:var(--muted);
}
.accent{color:var(--green)}
.paper{background:var(--paper);color:var(--ink)}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.rule{position:absolute;background:var(--hair)}
.rule.v{top:0;bottom:0;width:1px}
.rule.h{left:0;right:0;height:1px}
.top-meta{
  position:absolute;z-index:200;top:20px;left:26px;right:26px;
  display:flex;justify-content:space-between;align-items:center;
  pointer-events:none;
}
.runtime-badge{
  position:absolute;z-index:220;left:26px;bottom:24px;
  padding:7px 10px;border:1px solid rgba(255,255,255,.14);
  border-radius:999px;background:rgba(7,9,11,.45);backdrop-filter:blur(12px);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.66)
}
.controls{
  position:absolute;z-index:240;right:24px;bottom:20px;display:flex;gap:8px
}
.ctrl{
  appearance:none;border:1px solid rgba(255,255,255,.16);
  background:rgba(8,10,12,.56);color:var(--fg);
  border-radius:999px;padding:9px 13px;
  font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;backdrop-filter:blur(12px)
}
.progress{
  position:absolute;z-index:230;left:24px;right:24px;bottom:12px;height:2px;
  overflow:hidden;background:rgba(255,255,255,.10)
}
.progress > i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--green),var(--blue))}
.motion-orb{
  position:absolute;z-index:2;left:50%;top:50%;
  width:260px;height:260px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(62,207,142,.10),rgba(62,207,142,.02) 55%,transparent 70%);
  filter:blur(2px);pointer-events:none
}
.maskbox{overflow:hidden}
.maskbox > *{will-change:transform}
@media(max-width:900px){
  .big{font-size:clamp(62px,16vw,150px)}
  .mid{font-size:clamp(34px,10vw,90px)}
}
</style>
</head>
<body>
<div class="stage">
  <div class="motion-orb"></div>
  <div class="top-meta">
    <div class="micro">START IN / PORTFOLIO MOTION</div>
    <div class="micro">26 SEC / REPLAYABLE</div>
  </div>
  
<section class="scene is-active" id="c0"><div class="center"><div class="micro" id="intro4">A SHORT TITLE SEQUENCE FOR START IN</div></div></section>
<section class="scene" id="c1"><div class="center"><div class="big" id="where4">WHERE</div></div></section>
<section class="scene paper" id="c2"><div class="center"><div style="width:84%"><div class="big" id="do4" style="color:#111">DO YOU</div><div class="big" id="fit4" style="color:#0d9466;text-align:right">FIT?</div></div></div></section>
<section class="scene" id="c3"><div style="position:absolute;left:7%;top:20%"><div class="micro">SCENE 03</div><div class="mid" id="search4" style="margin-top:20px">SEARCH</div></div>
<div style="position:absolute;right:7%;bottom:18%;text-align:right"><div class="mid accent" id="match4">MATCH</div><div class="micro" style="margin-top:12px">THEN MOVE</div></div></section>
<section class="scene paper" id="c4"><div class="center"><div class="big" id="move4" style="color:#111">MOVE.</div></div></section>
<section class="scene" id="c5"><div class="center"><div style="text-align:center"><div class="micro">YOUR NEXT CHAPTER</div><div class="big" id="end4" style="margin-top:26px">START <span class="accent">IN</span></div></div></div></section>

  <div class="runtime-badge" id="runtimeBadge">loading runtime…</div>
  <div class="controls"><button class="ctrl" id="replay">Replay</button></div>
  <div class="progress"><i id="progressBar"></i></div>
</div>


<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@13.4.0/dist/motion.js"></script>
<script>
const TOTAL = 25500;
let master = null;
let fallbackTimers = [];
let fallbackAnimations = [];

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

function clearFallback() {
  fallbackTimers.forEach(clearTimeout);
  fallbackTimers = [];
  fallbackAnimations.forEach(a => { try { a.cancel(); } catch(e) {} });
  fallbackAnimations = [];
}

function showScene(id) {
  $$('.scene').forEach(s => {
    s.classList.remove('is-active');
    s.style.visibility = 'hidden';
    s.style.opacity = '0';
  });
  const el = document.getElementById(id);
  if(el) {
    el.classList.add('is-active');
    el.style.visibility = 'visible';
    el.style.opacity = '1';
  }
}

function later(ms, fn) {
  const id = setTimeout(fn, ms);
  fallbackTimers.push(id);
  return id;
}

function wa(el, frames, options={}) {
  if(!el) return;
  const a = el.animate(frames, {
    duration: options.duration || 800,
    delay: options.delay || 0,
    easing: options.easing || 'cubic-bezier(.2,.8,.2,1)',
    fill: 'forwards'
  });
  fallbackAnimations.push(a);
  return a;
}

function setRuntimeLabel(mode) {
  $('#runtimeBadge').textContent = mode;
}

function startProgress() {
  const bar = $('#progressBar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${TOTAL}ms linear`;
    bar.style.width = '100%';
  }));
}

function setupMotionInteractions() {
  if(!window.Motion) return;
  const { animate } = Motion;
  const replay = $('#replay');
  const orb = $('.motion-orb');
  replay.addEventListener('pointerenter', () => animate(replay, { scale: 1.08 }, { type:'spring', stiffness:420, damping:24 }));
  replay.addEventListener('pointerleave', () => animate(replay, { scale: 1 }, { type:'spring', stiffness:420, damping:24 }));
  replay.addEventListener('pointerdown', () => animate(replay, { scale: .94 }, { duration:.12 }));
  replay.addEventListener('pointerup', () => animate(replay, { scale: 1.06 }, { type:'spring', stiffness:500, damping:25 }));

  let lastX = innerWidth/2, lastY = innerHeight/2;
  addEventListener('pointermove', (e) => {
    lastX = e.clientX; lastY = e.clientY;
    animate(orb, {
      x: (lastX-innerWidth/2)*.10,
      y: (lastY-innerHeight/2)*.10,
      scale: 1 + Math.min(0.08, Math.abs(lastX-innerWidth/2)/innerWidth*.05)
    }, { type:'spring', stiffness:70, damping:18, mass:.5 });
  });
}

function restart() {
  location.reload();
}
$('#replay').addEventListener('click', restart);

window.addEventListener('load', () => {
  startProgress();
  const gsapOK = !!window.gsap;
  const motionOK = !!window.Motion;
  if(gsapOK) {
    setRuntimeLabel(`GSAP 3.13 + Motion 13.4 ${motionOK ? '· ACTIVE' : '· GSAP ACTIVE'}`);
    setupMotionInteractions();
    runGSAP();
  } else {
    setRuntimeLabel('OFFLINE FALLBACK · WEB ANIMATIONS');
    runFallback();
  }
});
</script>

<script>
function runGSAP() {

gsap.set('.scene',{autoAlpha:0});gsap.set('#c0',{autoAlpha:1});
master=gsap.timeline({defaults:{ease:'power4.out'}});
master.from('#intro4',{opacity:0,letterSpacing:'.8em',duration:1.6})
      .to('#intro4',{opacity:0,letterSpacing:'.36em',duration:.7},'+=1.65')
      .set('#c0',{autoAlpha:0}).set('#c1',{autoAlpha:1})
      .from('#where4',{scale:1.65,filter:'blur(22px)',opacity:0,duration:1.25})
      .to('#c1',{autoAlpha:0,duration:.45},'+=1.75')
      .set('#c2',{autoAlpha:1})
      .from('#do4',{x:-180,opacity:0,duration:1.05})
      .from('#fit4',{x:190,opacity:0,duration:1.1},'<.25')
      .to('#c2',{autoAlpha:0,duration:.45},'+=1.65')
      .set('#c3',{autoAlpha:1})
      .from('#search4',{clipPath:'inset(0 100% 0 0)',opacity:0,duration:1.1})
      .from('#match4',{clipPath:'inset(0 0 0 100%)',opacity:0,duration:1.1},'<.55')
      .to('#c3',{autoAlpha:0,duration:.45},'+=1.8')
      .set('#c4',{autoAlpha:1})
      .from('#move4',{y:150,rotation:5,opacity:0,duration:1.15})
      .to('#c4',{autoAlpha:0,duration:.45},'+=1.7')
      .set('#c5',{autoAlpha:1})
      .from('#end4',{scale:.78,letterSpacing:'.14em',opacity:0,duration:1.35,ease:'expo.out'});

}
function runFallback() {

wa($('#intro4'),[{opacity:0,letterSpacing:'.8em'},{opacity:1,letterSpacing:'.19em'}],{duration:1600});
later(4000,()=>{showScene('c1');wa($('#where4'),[{opacity:0,filter:'blur(22px)',transform:'scale(1.65)'},{opacity:1,filter:'blur(0)',transform:'scale(1)'}],{duration:1250})});
later(8000,()=>{showScene('c2');wa($('#do4'),[{opacity:0,transform:'translateX(-180px)'},{opacity:1,transform:'none'}],{duration:1050});wa($('#fit4'),[{opacity:0,transform:'translateX(190px)'},{opacity:1,transform:'none'}],{duration:1100,delay:250})});
later(12300,()=>{showScene('c3');wa($('#search4'),[{opacity:0,clipPath:'inset(0 100% 0 0)'},{opacity:1,clipPath:'inset(0 0 0 0)'}],{duration:1100});wa($('#match4'),[{opacity:0,clipPath:'inset(0 0 0 100%)'},{opacity:1,clipPath:'inset(0 0 0 0)'}],{duration:1100,delay:550})});
later(16900,()=>{showScene('c4');wa($('#move4'),[{opacity:0,transform:'translateY(150px) rotate(5deg)'},{opacity:1,transform:'none'}],{duration:1150})});
later(21000,()=>{showScene('c5');wa($('#end4'),[{opacity:0,transform:'scale(.78)',letterSpacing:'.14em'},{opacity:1,transform:'scale(1)',letterSpacing:'-.078em'}],{duration:1350})});

}
</script>
</body>
</html>
