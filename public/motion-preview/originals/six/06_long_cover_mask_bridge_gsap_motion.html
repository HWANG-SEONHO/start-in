<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>START IN — 06 Long Cover + Mask Bridge</title>
<style>
:root{
  --bg:#090b0e;
  --fg:#f4f0e8;
  --paper:#f2eee5;
  --ink:#0c0e10;
  --green:#3ecf8e;
  --blue:#86b4ff;
  --amber:#ffb15e;
  --muted:rgba(244,240,232,.58);
  --hair:rgba(244,240,232,.16);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,"Helvetica Neue",Arial,sans-serif}
body{user-select:none}
.stage{
  position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(circle at 18% 14%,rgba(62,207,142,.055),transparent 22%),
    radial-gradient(circle at 82% 18%,rgba(134,180,255,.045),transparent 22%),
    var(--bg);
}
.scene{position:absolute;inset:0;visibility:hidden;opacity:0;overflow:hidden}
.scene.is-active{visibility:visible}
.grid{position:absolute;inset:0;opacity:.16;pointer-events:none;background:
  linear-gradient(90deg,transparent 24.9%,rgba(255,255,255,.16) 25%,transparent 25.1%,transparent 49.9%,rgba(255,255,255,.16) 50%,transparent 50.1%,transparent 74.9%,rgba(255,255,255,.16) 75%,transparent 75.1%),
  linear-gradient(transparent 24.9%,rgba(255,255,255,.16) 25%,transparent 25.1%,transparent 49.9%,rgba(255,255,255,.16) 50%,transparent 50.1%,transparent 74.9%,rgba(255,255,255,.16) 75%,transparent 75.1%)}
.big{
  font-size:clamp(78px,13vw,220px);
  line-height:.82;
  font-weight:900;
  letter-spacing:-.078em;
  text-transform:uppercase;
}
.mid{
  font-size:clamp(44px,7.2vw,116px);
  line-height:.9;
  font-weight:900;
  letter-spacing:-.058em;
  text-transform:uppercase;
}
.micro{
  font-size:11px;
  line-height:1.4;
  letter-spacing:.19em;
  text-transform:uppercase;
  color:var(--muted);
}
.accent{color:var(--green)}
.paper{background:var(--paper);color:var(--ink)}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.rule{position:absolute;background:var(--hair)}
.rule.v{top:0;bottom:0;width:1px}
.rule.h{left:0;right:0;height:1px}
.top-meta{
  position:absolute;z-index:200;top:20px;left:26px;right:26px;
  display:flex;justify-content:space-between;align-items:center;
  pointer-events:none;
}
.runtime-badge{
  position:absolute;z-index:220;left:26px;bottom:24px;
  padding:7px 10px;border:1px solid rgba(255,255,255,.14);
  border-radius:999px;background:rgba(7,9,11,.45);backdrop-filter:blur(12px);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.66)
}
.controls{
  position:absolute;z-index:240;right:24px;bottom:20px;display:flex;gap:8px
}
.ctrl{
  appearance:none;border:1px solid rgba(255,255,255,.16);
  background:rgba(8,10,12,.56);color:var(--fg);
  border-radius:999px;padding:9px 13px;
  font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;backdrop-filter:blur(12px)
}
.progress{
  position:absolute;z-index:230;left:24px;right:24px;bottom:12px;height:2px;
  overflow:hidden;background:rgba(255,255,255,.10)
}
.progress > i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--green),var(--blue))}
.motion-orb{
  position:absolute;z-index:2;left:50%;top:50%;
  width:260px;height:260px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(62,207,142,.10),rgba(62,207,142,.02) 55%,transparent 70%);
  filter:blur(2px);pointer-events:none
}
.maskbox{overflow:hidden}
.maskbox > *{will-change:transform}
@media(max-width:900px){
  .big{font-size:clamp(62px,16vw,150px)}
  .mid{font-size:clamp(34px,10vw,90px)}
}
</style>
</head>
<body>
<div class="stage">
  <div class="motion-orb"></div>
  <div class="top-meta">
    <div class="micro">START IN / PORTFOLIO MOTION</div>
    <div class="micro">25 SEC / REPLAYABLE</div>
  </div>
  
<section class="scene is-active" id="b0"><div class="grid"></div><div style="position:absolute;left:6%;right:6%;top:15%">
  <div class="micro">PORTFOLIO COVER / START IN</div>
  <div class="big" id="hero6" style="margin-top:42px">FIND<br>YOUR<br><span class="accent">START.</span></div>
</div></section>
<section class="scene" id="b1"><div class="center"><div class="big" id="q6">WHERE?</div></div></section>
<section class="scene paper" id="b2"><div class="center"><div style="width:80%">
  <div class="mid item6" style="color:#111">BUSAN</div>
  <div class="mid item6" style="color:#0d9466;text-align:center">DESIGN</div>
  <div class="mid item6" style="color:#111;text-align:right">1,248</div>
</div></div></section>
<section class="scene" id="b3"><div class="center"><div class="big" id="brand6">START <span class="accent">IN</span></div></div></section>
<section class="scene paper" id="b4">
  <div id="fakeMain" style="position:absolute;inset:0;background:#fbfbfa;color:#111;padding:6.5% 8%">
    <div style="font-size:23px;font-weight:900;letter-spacing:-.04em">START <span style="color:#0d9466">IN</span></div>
    <div style="margin-top:8%;max-width:820px;font-size:clamp(42px,5vw,84px);font-weight:900;letter-spacing:-.055em;line-height:1.02">
      내 조건에서<br>지금 볼 공고를<br><span style="color:#0d9466">빠르게 확인.</span>
    </div>
    <div style="margin-top:48px;width:min(760px,72vw);height:64px;border:1px solid #d8deda;border-radius:18px;background:#fff;box-shadow:0 12px 32px rgba(0,0,0,.05)"></div>
    <div style="margin-top:34px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:980px">
      <div style="height:105px;border:1px solid #e0e5e2;border-radius:18px;background:white"></div>
      <div style="height:105px;border:1px solid #e0e5e2;border-radius:18px;background:white"></div>
      <div style="height:105px;border:1px solid #e0e5e2;border-radius:18px;background:white"></div>
    </div>
  </div>
  <div id="curtainTop" style="position:absolute;left:0;right:0;top:0;height:50%;background:#090b0e"></div>
  <div id="curtainBottom" style="position:absolute;left:0;right:0;bottom:0;height:50%;background:#090b0e"></div>
  <div id="bridgeLine" style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(62,207,142,.5);transform:scaleY(0)"></div>
</section>

  <div class="runtime-badge" id="runtimeBadge">loading runtime…</div>
  <div class="controls"><button class="ctrl" id="replay">Replay</button></div>
  <div class="progress"><i id="progressBar"></i></div>
</div>


<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@13.4.0/dist/motion.js"></script>
<script>
const TOTAL = 25000;
let master = null;
let fallbackTimers = [];
let fallbackAnimations = [];

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

function clearFallback() {
  fallbackTimers.forEach(clearTimeout);
  fallbackTimers = [];
  fallbackAnimations.forEach(a => { try { a.cancel(); } catch(e) {} });
  fallbackAnimations = [];
}

function showScene(id) {
  $$('.scene').forEach(s => {
    s.classList.remove('is-active');
    s.style.visibility = 'hidden';
    s.style.opacity = '0';
  });
  const el = document.getElementById(id);
  if(el) {
    el.classList.add('is-active');
    el.style.visibility = 'visible';
    el.style.opacity = '1';
  }
}

function later(ms, fn) {
  const id = setTimeout(fn, ms);
  fallbackTimers.push(id);
  return id;
}

function wa(el, frames, options={}) {
  if(!el) return;
  const a = el.animate(frames, {
    duration: options.duration || 800,
    delay: options.delay || 0,
    easing: options.easing || 'cubic-bezier(.2,.8,.2,1)',
    fill: 'forwards'
  });
  fallbackAnimations.push(a);
  return a;
}

function setRuntimeLabel(mode) {
  $('#runtimeBadge').textContent = mode;
}

function startProgress() {
  const bar = $('#progressBar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${TOTAL}ms linear`;
    bar.style.width = '100%';
  }));
}

function setupMotionInteractions() {
  if(!window.Motion) return;
  const { animate } = Motion;
  const replay = $('#replay');
  const orb = $('.motion-orb');
  replay.addEventListener('pointerenter', () => animate(replay, { scale: 1.08 }, { type:'spring', stiffness:420, damping:24 }));
  replay.addEventListener('pointerleave', () => animate(replay, { scale: 1 }, { type:'spring', stiffness:420, damping:24 }));
  replay.addEventListener('pointerdown', () => animate(replay, { scale: .94 }, { duration:.12 }));
  replay.addEventListener('pointerup', () => animate(replay, { scale: 1.06 }, { type:'spring', stiffness:500, damping:25 }));

  let lastX = innerWidth/2, lastY = innerHeight/2;
  addEventListener('pointermove', (e) => {
    lastX = e.clientX; lastY = e.clientY;
    animate(orb, {
      x: (lastX-innerWidth/2)*.10,
      y: (lastY-innerHeight/2)*.10,
      scale: 1 + Math.min(0.08, Math.abs(lastX-innerWidth/2)/innerWidth*.05)
    }, { type:'spring', stiffness:70, damping:18, mass:.5 });
  });
}

function restart() {
  location.reload();
}
$('#replay').addEventListener('click', restart);

window.addEventListener('load', () => {
  startProgress();
  const gsapOK = !!window.gsap;
  const motionOK = !!window.Motion;
  if(gsapOK) {
    setRuntimeLabel(`GSAP 3.13 + Motion 13.4 ${motionOK ? '· ACTIVE' : '· GSAP ACTIVE'}`);
    setupMotionInteractions();
    runGSAP();
  } else {
    setRuntimeLabel('OFFLINE FALLBACK · WEB ANIMATIONS');
    runFallback();
  }
});
</script>

<script>
function runGSAP() {

gsap.set('.scene',{autoAlpha:0});gsap.set('#b0',{autoAlpha:1});
master=gsap.timeline({defaults:{ease:'power4.out'}});
master.from('#hero6',{y:140,opacity:0,clipPath:'inset(100% 0 0 0)',duration:1.3})
      .to('#hero6',{letterSpacing:'-.045em',duration:1.1,ease:'sine.inOut'},'+=.75')
      .to('#b0',{autoAlpha:0,duration:.45},'+=1.15')
      .set('#b1',{autoAlpha:1})
      .from('#q6',{scale:1.6,filter:'blur(20px)',opacity:0,duration:1.2})
      .to('#b1',{autoAlpha:0,duration:.45},'+=1.6')
      .set('#b2',{autoAlpha:1})
      .from('#b2 .item6',{x:(i)=>i%2?-160:160,opacity:0,stagger:.3,duration:.95})
      .to('#b2',{autoAlpha:0,duration:.45},'+=1.65')
      .set('#b3',{autoAlpha:1})
      .from('#brand6',{scale:.76,letterSpacing:'.14em',opacity:0,duration:1.3,ease:'expo.out'})
      .to('#brand6',{scale:1.04,duration:.8,ease:'sine.inOut'},'+=.55')
      .to('#b3',{autoAlpha:0,duration:.4},'+=.8')
      .set('#b4',{autoAlpha:1})
      .fromTo('#bridgeLine',{scaleY:0},{scaleY:1,duration:.55,transformOrigin:'50% 50%',ease:'power2.out'})
      .to('#curtainTop',{y:'-101%',duration:1.5,ease:'expo.inOut'},'<.15')
      .to('#curtainBottom',{y:'101%',duration:1.5,ease:'expo.inOut'},'<')
      .to('#bridgeLine',{scaleY:0,opacity:0,duration:.35},'<.95')
      .from('#fakeMain > *',{y:28,opacity:0,stagger:.12,duration:.72},'<.2');

}
function runFallback() {

wa($('#hero6'),[{opacity:0,transform:'translateY(140px)'},{opacity:1,transform:'none'}],{duration:1300});
later(5600,()=>{showScene('b1');wa($('#q6'),[{opacity:0,filter:'blur(20px)',transform:'scale(1.6)'},{opacity:1,filter:'blur(0)',transform:'scale(1)'}],{duration:1200})});
later(9700,()=>{showScene('b2');$$('#b2 .item6').forEach((e,i)=>wa(e,[{opacity:0,transform:`translateX(${i%2?-160:160}px)`},{opacity:1,transform:'none'}],{duration:950,delay:i*300}))});
later(14100,()=>{showScene('b3');wa($('#brand6'),[{opacity:0,transform:'scale(.76)',letterSpacing:'.14em'},{opacity:1,transform:'scale(1)',letterSpacing:'-.078em'}],{duration:1300})});
later(18700,()=>{showScene('b4');wa($('#curtainTop'),[{transform:'translateY(0)'},{transform:'translateY(-101%)'}],{duration:1500,delay:450});wa($('#curtainBottom'),[{transform:'translateY(0)'},{transform:'translateY(101%)'}],{duration:1500,delay:450})});

}
</script>
</body>
</html>
